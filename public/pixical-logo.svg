<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Camera Body Gradient: Green to Blue -->
    <linearGradient id="camGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00D26A" />
      <stop offset="45%" stop-color="#00C49F" />
      <stop offset="100%" stop-color="#007BFF" />
    </linearGradient>

    <!-- Top Right Corner Gradient -->
    <linearGradient id="topRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0091FF" />
      <stop offset="100%" stop-color="#0070F3" />
    </linearGradient>

    <!-- Bottom Right Corner Gradient -->
    <linearGradient id="bottomRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E00" />
      <stop offset="100%" stop-color="#FF6200" />
    </linearGradient>

    <!-- Fork Gradient: Golden Orange to Bright Red -->
    <linearGradient id="forkGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="50%" stop-color="#FF6D00" />
      <stop offset="100%" stop-color="#FF2E36" />
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C853" />
      <stop offset="100%" stop-color="#43A047" />
    </linearGradient>

    <!-- Drop Shadows for cute depth -->
    <filter id="cuteShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- VIEW FINDER BRACKETS -->
  <!-- Top Left (Green) -->
  <path d="M 160 102 H 142 C 128.745 102 118 112.745 118 126 V 144" stroke="#00D068" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Top Right (Blue) -->
  <path d="M 338 102 H 356 C 369.255 102 380 112.745 380 126 V 144" stroke="url(#topRightGrad)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom Left (Green) -->
  <path d="M 118 280 V 298 C 118 311.255 128.745 322 142 322 H 160" stroke="#00D068" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom Right (Orange) -->
  <path d="M 380 280 V 298 C 380 311.255 369.255 322 356 322 H 338" stroke="url(#bottomRightGrad)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" />

  <!-- CAMERA BODY (Green to Blue Gradient) -->
  <path d="
    M 198 128 
    C 203 115 215 107 229 107 
    H 271 
    C 285 107 297 115 302 128 
    H 326 
    C 346.987 128 364 145.013 364 166 
    V 264 
    C 364 284.987 346.987 302 326 302 
    H 174 
    C 153.013 302 136 284.987 136 264 
    V 166 
    C 136 145.013 153.013 128 174 128 
    Z" 
    fill="url(#camGrad)" filter="url(#cuteShadow)" />

  <!-- Camera Flash Lens Dot -->
  <circle cx="330" cy="162" r="11" fill="#FFFFFF" opacity="0.95" />

  <!-- PLATE LENS (White Disc with subtle inner rim) -->
  <circle cx="249" cy="223" r="80" fill="#FFFFFF" filter="url(#cuteShadow)" />
  <circle cx="249" cy="223" r="70" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2.5" />

  <!-- LEAVES ON PLATE -->
  <!-- Big Leaf -->
  <path d="M 244 160 C 274 158 290 190 288 220 C 260 216 244 186 244 160 Z" fill="url(#leafGrad)" />
  <path d="M 247 163 Q 268 186 287 218" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.5" />

  <!-- Small Leaf -->
  <path d="M 290 196 C 314 196 322 222 314 238 C 298 234 290 212 290 196 Z" fill="url(#leafGrad)" />

  <!-- FORK IN CENTER -->
  <g transform="translate(208, 200)">
    <!-- 3 Tines connected to head -->
    <!-- Left tine -->
    <rect x="0" y="0" width="12" height="38" rx="6" fill="#FFA000" />
    <!-- Center tine -->
    <rect x="18" y="0" width="12" height="38" rx="6" fill="#FF8F00" />
    <!-- Right tine -->
    <rect x="36" y="0" width="12" height="38" rx="6" fill="#FF7D00" />
    
    <!-- Fork base bridge and tapered handle -->
    <path d="
      M 0 24 
      C 0 46 8 52 18 54 
      V 94 
      C 18 102 30 102 30 94 
      V 54 
      C 40 52 48 46 48 24 
      Z" 
      fill="url(#forkGrad)" />
  </g>

  <!-- PIXICAL WORDMARK -->
  <g transform="translate(0, 360)">
    <!-- 'P' (Deep Pine/Dark #0D2619) -->
    <path d="M 70 60 V -18 H 106 C 126 -18 138 -6 138 11 C 138 28 126 40 106 40 H 91 V 60 H 70 Z M 91 22 H 104 C 114 22 117 17 117 11 C 117 5 114 0 104 0 H 91 V 22 Z" fill="#0C2518" />

    <!-- 'i' with cute green leaf as dot -->
    <path d="M 144 60 V 4 H 164 V 60 H 144 Z" fill="#0C2518" />
    <!-- Leaf dot for 'i' -->
    <path d="M 154 -18 C 174 -20 184 2 178 20 C 160 18 152 -2 154 -18 Z" fill="#00C853" />

    <!-- 'x' (Deep Pine/Dark) -->
    <path d="M 174 60 L 198 30 L 176 4 H 200 L 210 20 L 222 4 H 244 L 222 30 L 246 60 H 222 L 210 42 L 198 60 H 174 Z" fill="#0C2518" />

    <!-- 'i' (Blue) -->
    <path d="M 238 60 V 4 H 258 V 60 H 238 Z" fill="#007BFF" />
    <circle cx="248" cy="-8" r="10" fill="#007BFF" />

    <!-- 'C' (Blue) -->
    <path d="M 334 50 C 322 62 304 65 288 60 C 272 55 264 40 264 24 C 264 8 274 -6 290 -14 C 306 -20 326 -16 336 -2 L 322 12 C 316 4 306 0 294 4 C 284 8 280 18 280 26 C 280 34 286 44 296 46 C 308 48 316 42 322 36 L 334 50 Z" fill="#007BFF" />

    <!-- 'a' (Orange) -->
    <path d="M 390 60 H 372 V 48 C 366 56 354 62 342 62 C 326 62 316 50 316 34 C 316 16 330 6 352 6 H 372 V 4 C 372 -4 366 -8 354 -8 C 344 -8 336 -4 330 0 L 322 -14 C 332 -20 346 -24 362 -24 C 388 -24 390 -4 390 12 V 60 Z M 372 22 H 354 C 342 22 336 28 336 34 C 336 40 342 46 352 46 C 362 46 372 40 372 30 V 22 Z" fill="#FF7A00" />

    <!-- 'l' (Red) -->
    <path d="M 408 60 V -28 H 428 V 60 H 408 Z" fill="#FF3333" />
  </g>
</svg>
